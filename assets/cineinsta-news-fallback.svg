<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Cineinsta News</title>
<desc id="desc">Original Cineinsta generic cinema news image used only when a publisher image is unavailable.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171717"/>
    <stop offset="1" stop-color="#b51f2a"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1020" cy="120" r="150" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="30"/>
<circle cx="1020" cy="120" r="55" fill="#ffffff" fill-opacity=".10"/>
<g fill="#fff">
  <circle cx="1020" cy="45" r="16"/>
  <circle cx="1095" cy="120" r="16"/>
  <circle cx="1020" cy="195" r="16"/>
  <circle cx="945" cy="120" r="16"/>
</g>
<text x="80" y="300" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">CINEINSTA</text>
<text x="84" y="365" fill="#fff" fill-opacity=".86" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="4">TELUGU CINEMA</text>
<rect x="84" y="415" width="210" height="8" rx="4" fill="#fff" fill-opacity=".85"/>
<text x="84" y="490" fill="#fff" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="24">News image unavailable</text>
</svg>
