<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOX OFFICE BATTLE | Cineinsta</title><meta name="description" content="Cineinsta Box Office Battle — significant Telugu films from 2015 onward."><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}header{padding:42px 18px 28px;text-align:center;border-bottom:1px solid #242424}h1{margin:0;font-size:clamp(30px,6vw,58px);letter-spacing:2px}.wrap{max-width:1180px;margin:auto;padding:22px 16px 60px}.note{color:#aaa;line-height:1.5}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select{background:#151515;color:#fff;border:1px solid #333;border-radius:10px;padding:12px 14px;font-size:15px}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#111;border:1px solid #282828;border-radius:16px;padding:18px}.year{font-size:12px;opacity:.6}.title{font-size:20px;font-weight:700;margin:7px 0}.meta{font-size:13px;line-height:1.6;color:#bbb}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#222;color:#aaa;font-size:11px}.empty{padding:30px;text-align:center;color:#888}</style></head><body><header><h1>BOX OFFICE BATTLE</h1></header><main class="wrap"><p class="note">Cineinsta's Telugu cinema comparison database — 2015 to present. This standalone build contains the master film list. Box-office figures will be added only after source verification.</p><div class="controls"><input id="search" placeholder="Search a movie, hero or director…"><select id="year"><option value="">All years</option></select></div><div id="grid" class="grid"></div></main><script>let films=[];const search=document.getElementById('search'),year=document.getElementById('year'),grid=document.getElementById('grid');fetch('./box-office-battle.json').then(r=>r.json()).then(d=>{films=d.films||[];[...new Set(films.map(f=>f.year))].sort((a,b)=>b-a).forEach(y=>year.insertAdjacentHTML('beforeend',`<option>${y}</option>`));render()}).catch(()=>grid.innerHTML='<div class="empty">Unable to load the database.</div>');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const q=search.value.toLowerCase().trim(),y=year.value;const rows=films.filter(f=>(!y||String(f.year)===y)&&(!q||`${f.title} ${f.hero} ${f.director}`.toLowerCase().includes(q)));grid.innerHTML=rows.length?rows.map(f=>`<article class="card"><div class="year">${f.year}</div><div class="title">${esc(f.title)}</div><div class="meta"><b>Hero:</b> ${esc(f.hero)}<br><b>Director:</b> ${esc(f.director)}</div><span class="badge">Master list — figures pending verification</span></article>`).join(''):'<div class="empty">No films found.</div>'}search.addEventListener('input',render);year.addEventListener('change',render)</script></body></html>
