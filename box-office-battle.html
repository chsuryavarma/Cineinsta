<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cineinsta</title>
<meta name="description" content="Visit Cineinsta for the latest Indian cinema news, reviews and entertainment.">
<style>
:root{
  --bg:#07080b;
  --text:#f5f7fb;
  --muted:#9aa2b1;
  --accent:#ffb000;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,176,0,.12),transparent 32%),
    radial-gradient(circle at 85% 15%,rgba(255,92,53,.10),transparent 30%),
    var(--bg);
  color:var(--text);
}
.card{
  width:min(620px,calc(100% - 40px));
  text-align:center;
  padding:56px 30px 62px;
}
.brand{
  display:inline-block;
  color:#f5f7fb;
  text-decoration:none;
  font-size:30px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:34px;
}
.brand span{color:var(--accent)}
.kicker{
  color:var(--accent);
  font-size:11px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:14px;
}
h1{
  margin:0 0 16px;
  font-size:clamp(34px,7vw,58px);
  line-height:1;
  letter-spacing:-2px;
}
p{
  margin:0 auto 30px;
  max-width:500px;
  color:var(--muted);
  line-height:1.6;
  font-size:15px;
}
.button{
  display:inline-block;
  padding:13px 24px;
  border-radius:999px;
  background:var(--accent);
  color:#111;
  text-decoration:none;
  font-weight:900;
  font-size:14px;
}
.button:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="https://www.cineinsta.com/" aria-label="Go to Cineinsta home">CINE<span>INSTA</span></a>
  <div class="kicker">CINEINSTA</div>
  <h1>BOX OFFICE BATTLE</h1>
  <p>This feature has moved to the main Cineinsta experience.</p>
  <a class="button" href="https://www.cineinsta.com/">GO TO CINEINSTA</a>
</main>
</body>
</html>
