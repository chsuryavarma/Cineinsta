name: Update Cineinsta Feed

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Cineinsta
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and validate feed candidates
        env:
          GEMINI_API_KEY: ${{ secrets.CINEINSTA_GOOGLE }}
        run: |
          node scripts/generate-feed-candidates.mjs

      - name: Publish automatically approved feed
        run: |
          node scripts/publish-feed.mjs

      - name: Commit updated feed
        run: |
          git config user.name "Cineinsta Feed Bot"
          git config user.email "cineinsta-bot@users.noreply.github.com"

          git add data/feed.json data/feed-candidates.json data/feed-source.json

          git diff --cached --quiet || git commit -m "Auto-publish Cineinsta feed"

          git push
