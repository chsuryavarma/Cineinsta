name: Update Cineinsta Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two feed workflows from generating and pushing at the same time.
concurrency:
  group: cineinsta-feed-main
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cineinsta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate feed candidates
        id: editorial
        env:
          GEMINI_API_KEY: ${{ secrets.CINEINSTA_GOOGLE }}
        run: |
          set +e
          node scripts/generate-feed-candidates.mjs
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "EDITORIAL_FAILED=true" >> "$GITHUB_OUTPUT"
            echo "Editorial generation did not produce a publishable batch."
            echo "The existing published feed will be preserved."
            echo "The workflow will continue so Buzz, theatre signals, trailers and sitemaps can still update."
          else
            echo "EDITORIAL_FAILED=false" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Publish automatically approved feed
        if: steps.editorial.outputs.EDITORIAL_FAILED != 'true'
        run: |
          node scripts/publish-feed.mjs

      - name: Update South Indian trailer feed
        run: |
          node scripts/update-trailers-SOUTH-ONLY-SAFE.mjs

      - name: Update Cineinsta theatre trend signals
        env:
          SHOWTIMES_API_KEY: ${{ secrets.SHOWTIMES_API_KEY }}
        run: |
          node scripts/update-ticket-trends.mjs

      - name: Generate Cineinsta Buzz
        run: |
          node scripts/update-buzz.mjs

      - name: Generate Cineinsta sitemaps
        run: |
          node scripts/generate-sitemap.mjs

      - name: Commit updated feed, generic news images, Buzz and sitemaps
        run: |
          git config user.name "Cineinsta Feed Bot"
          git config user.email "cineinsta-bot@users.noreply.github.com"

          git add data/feed.json data/feed-candidates.json data/feed-source.json data/buzz.json sitemap.xml sitemap-pages.xml sitemap-news.xml assets/news-generic

          if [ -f data/ticket-trends.json ]; then
            git add data/ticket-trends.json
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update Cineinsta feed, South Indian trailers, Buzz and sitemaps"

          # The remote main branch may have advanced while this job was running.
          # Rebase this generated commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main

          # Push the rebased commit to the current main branch.
          git push origin HEAD:main
