name: Update Cineinsta Feed

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Cineinsta
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect cinema feed
        run: |
          node scripts/update-feed.mjs

      - name: Create Cineinsta editorial candidates
        env:
          GEMINI_API_KEY: ${{ secrets.CINEINSTA_GOOGLE }}
        run: |
          node scripts/editorial-rewrite.mjs

      - name: Commit candidate feed
        run: |
          git config user.name "Cineinsta Feed Bot"
          git config user.email "cineinsta-bot@users.noreply.github.com"

          git add data/feed-candidates.json

          git diff --cached --quiet || git commit -m "Update Cineinsta editorial candidates"

          git push
